<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    p.sub { color: #94a3b8; margin-bottom: 22px; font-size: 0.95rem; }

    label { display: block; text-align: left; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #0b1220;
      color: #e2e8f0;
      font-size: 1rem;
      margin-bottom: 18px;
    }

    /* White box that holds the QR image (white so it scans well). */
    .qrbox {
      background: #fff;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qrImg { width: 240px; height: 240px; display: none; }
    .hint { color: #94a3b8; font-size: 0.85rem; padding: 30px 10px; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #38bdf8;
      color: #04283b;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>

<body>
  <div class="card">
    <h1>QR Code Generator</h1>
    <p class="sub">Turn any link or text into a scannable QR code.</p>

    <label for="text">Link or text</label>
    <input id="text" type="text" placeholder="https://your-website.com" oninput="generate()" />

    <div class="qrbox">
      <span class="hint" id="hint">Your QR code will appear here</span>
      <img id="qrImg" alt="QR code" />
    </div>

    <button id="download" onclick="downloadPNG()" disabled>Download PNG</button>
  </div>

  <script>
    // A free QR web service: we send it text, it returns a QR image.
    const API = "https://api.qrserver.com/v1/create-qr-code/";

    const input = document.getElementById("text");
    const img = document.getElementById("qrImg");
    const hint = document.getElementById("hint");
    const downloadBtn = document.getElementById("download");
    let currentUrl = "";

    // Called on every keystroke: build the image URL for whatever was typed.
    function generate() {
      const text = input.value.trim();
      if (!text) {
        img.style.display = "none";
        hint.style.display = "block";
        downloadBtn.disabled = true;
        currentUrl = "";
        return;
      }
      // encodeURIComponent makes the text safe to put inside a URL.
      currentUrl = API + "?size=300x300&data=" + encodeURIComponent(text);
      img.src = currentUrl;
      img.style.display = "block";
      hint.style.display = "none";
      downloadBtn.disabled = false;
    }

    // Save the QR as a PNG file.
    async function downloadPNG() {
      if (!currentUrl) return;
      try {
        const response = await fetch(currentUrl);
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "qrcode.png";
        link.click();
        URL.revokeObjectURL(link.href);
      } catch (e) {
        // If the download is blocked, just open the image so the user can save it.
        window.open(currentUrl, "_blank");
      }
    }
  </script>
</body>
</html>
