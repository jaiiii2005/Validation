<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Flashcard Maker</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .app { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.6rem; }
    p.sub { color: #94a3b8; margin: 4px 0 20px; font-size: 0.95rem; }

    textarea {
      width: 100%; min-height: 150px; padding: 14px;
      border: 1px solid #334155; border-radius: 10px;
      background: #1e293b; color: #e2e8f0; font-size: 0.95rem; font-family: inherit;
      resize: vertical; margin-bottom: 12px;
    }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button.primary {
      border: none; border-radius: 9px; background: #38bdf8; color: #04283b;
      font-size: 1rem; font-weight: 700; padding: 12px 22px; cursor: pointer;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { color: #64748b; font-size: 0.85rem; }

    .status { margin: 18px 0; color: #94a3b8; }
    .status.error { color: #f87171; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px; margin-top: 22px;
    }
    /* A flashcard: click to flip between question and answer. */
    .card {
      background: #1e293b; border: 1px solid #273449; border-radius: 12px;
      min-height: 150px; padding: 16px; cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center; text-align: center;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #38bdf8; }
    .card .label {
      position: absolute; top: 8px; left: 12px; font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.5px; color: #64748b;
    }
    .card .text { font-size: 0.98rem; line-height: 1.45; }
    .card.flipped { background: #0b2a3a; border-color: #38bdf8; }
    .card.flipped .text { color: #bae6fd; }
  </style>
</head>

<body>
  <div class="app">
    <h1>AI Flashcard Maker</h1>
    <p class="sub">Paste your study notes and get instant flashcards. Click a card to flip it.</p>

    <textarea id="notes" placeholder="Paste your notes here — e.g. a topic from your course..."></textarea>

    <div class="controls">
      <button class="primary" id="gen" onclick="generate()">Generate flashcards</button>
      <span class="hint">Tip: paste a few paragraphs for the best cards.</span>
    </div>

    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    // Reuse the same backend we built for the Code Tutor — it just forwards
    // requests to Gemini, so any tool can use it. The key stays hidden there.
    const WORKER_URL = "https://c-tutor.jkadvertising.workers.dev";

    const notesEl = document.getElementById("notes");
    const genBtn = document.getElementById("gen");
    const statusEl = document.getElementById("status");
    const grid = document.getElementById("grid");

    async function generate() {
      const notes = notesEl.value.trim();
      if (!notes) { setStatus("Please paste some notes first.", true); return; }

      grid.innerHTML = "";
      setStatus("Making your flashcards...");
      genBtn.disabled = true;

      const payload = {
        systemInstruction: {
          parts: [{
            text: "You are a study assistant. From the user's notes, create clear, "
              + "concise flashcards covering the key concepts. Make 8-12 cards. "
              + "Each 'q' is a short question; each 'a' is a short, correct answer. "
              + "Respond ONLY with a JSON array of objects like "
              + '[{"q":"...","a":"..."}].',
          }],
        },
        contents: [{ role: "user", parts: [{ text: notes }] }],
        // Ask Gemini to return clean JSON we can parse directly.
        generationConfig: { temperature: 0.4, responseMimeType: "application/json" },
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ? data.error.message : "HTTP " + res.status);

        const raw = data.candidates && data.candidates[0]
          && data.candidates[0].content.parts.map((p) => p.text).join("");
        const cards = parseCards(raw);
        if (!cards.length) throw new Error("Could not read any flashcards from the response.");

        renderCards(cards);
        setStatus(cards.length + " flashcards ready — click any card to flip it.");
      } catch (err) {
        setStatus("Error: " + err.message, true);
      } finally {
        genBtn.disabled = false;
      }
    }

    // Turn the AI's reply into an array of {q, a}. Strips code fences if present.
    function parseCards(raw) {
      if (!raw) return [];
      let text = raw.trim().replace(/^```[a-zA-Z]*\n?/, "").replace(/```$/, "");
      try {
        const arr = JSON.parse(text);
        return Array.isArray(arr) ? arr.filter((c) => c && c.q && c.a) : [];
      } catch (e) {
        return [];
      }
    }

    function renderCards(cards) {
      grid.innerHTML = "";
      cards.forEach((card) => {
        const el = document.createElement("div");
        el.className = "card";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "Question";
        const text = document.createElement("div");
        text.className = "text";
        text.textContent = card.q;
        el.appendChild(label);
        el.appendChild(text);
        // Click flips between question and answer.
        let showingAnswer = false;
        el.addEventListener("click", () => {
          showingAnswer = !showingAnswer;
          el.classList.toggle("flipped", showingAnswer);
          label.textContent = showingAnswer ? "Answer" : "Question";
          text.textContent = showingAnswer ? card.a : card.q;
        });
        grid.appendChild(el);
      });
    }

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (isError ? " error" : "");
    }
  </script>
</body>
</html>
