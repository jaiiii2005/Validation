<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C Programming Tutor</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app { width: 100%; max-width: 760px; height: 100vh; display: flex; flex-direction: column; padding: 16px; }

    header { padding: 6px 4px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    header h1 { font-size: 1.25rem; }
    header p { color: #94a3b8; font-size: 0.85rem; }
    .newchat {
      flex-shrink: 0; border: 1px solid #334155; border-radius: 8px; background: #1e293b;
      color: #e2e8f0; font-size: 0.85rem; font-weight: 600; padding: 8px 12px; cursor: pointer;
    }
    .newchat:hover { background: #273449; }

    .styleBar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.85rem; color: #94a3b8; }
    .styleBar select {
      padding: 7px 10px; border: 1px solid #334155; border-radius: 8px;
      background: #0b1220; color: #e2e8f0; font-size: 0.9rem;
    }

    .messages { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; font-size: 0.95rem; }
    .user { background: #1e40af; align-self: flex-end; border-bottom-right-radius: 3px; }
    .bot { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 3px; }
    .code-wrap { position: relative; }
    .bot pre {
      background: #0b1220; border: 1px solid #273449; border-radius: 8px;
      padding: 10px 12px; margin: 8px 0; overflow-x: auto;
      font-family: Consolas, Menlo, monospace; font-size: 0.85rem; white-space: pre;
    }
    .bot code { background: #0b1220; padding: 1px 5px; border-radius: 4px; font-family: Consolas, Menlo, monospace; font-size: 0.85rem; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px; border: none; border-radius: 6px;
      background: #334155; color: #e2e8f0; font-size: 0.72rem; font-weight: 600;
      padding: 4px 9px; cursor: pointer; opacity: 0.85;
    }
    .copy-btn:hover { opacity: 1; }
    .empty { color: #64748b; text-align: center; margin: auto; font-size: 0.9rem; }

    .composer { display: flex; gap: 8px; padding-top: 10px; }
    .composer textarea {
      flex: 1; resize: none; height: 52px; padding: 12px;
      border: 1px solid #334155; border-radius: 8px;
      background: #0b1220; color: #e2e8f0; font-size: 0.95rem; font-family: inherit;
    }
    .composer button {
      border: none; border-radius: 8px; background: #38bdf8; color: #04283b;
      font-weight: 700; padding: 0 20px; cursor: pointer; font-size: 0.95rem;
    }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>C Programming Tutor</h1>
        <p>Ask any C question — beginner to interview level. It solves code and explains it your way.</p>
      </div>
      <button class="newchat" onclick="newChat()">+ New chat</button>
    </header>

    <div class="styleBar">
      <span>Explain answers:</span>
      <select id="style">
        <option value="detailed">In detail (step by step)</option>
        <option value="examples">With examples</option>
        <option value="short">Short &amp; to the point</option>
        <option value="code">Mostly just the code</option>
      </select>
    </div>

    <div class="messages" id="messages">
      <div class="empty" id="empty">Ask me a C question to begin. Example: "Write a program to reverse a string."</div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="Type your C question or paste code... (Enter to send)"></textarea>
      <button id="send" onclick="send()">Send</button>
    </div>
  </div>

  <script>
    // Our backend (a Cloudflare Worker) holds the API key secretly and talks to
    // Gemini for us. The key is NEVER in this page — safe to share with anyone.
    const WORKER_URL = "https://c-tutor.jkadvertising.workers.dev";
    const STORAGE_KEY = "cTutorHistory";

    const styleSel = document.getElementById("style");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // The whole conversation, so follow-up questions have context.
    const history = [];

    // Build the tutor's instructions based on the chosen style.
    function systemText() {
      const styles = {
        detailed: "Explain your solution thoroughly, step by step, so a beginner can follow.",
        examples: "Include example inputs and outputs and show how the code is used.",
        short: "Keep explanations brief and to the point.",
        code: "Give mainly the code with only minimal explanation.",
      };
      return "You are an expert C programming tutor. You help with C questions from "
        + "beginner to advanced interview level. Given a problem, provide correct, "
        + "well-written C code. Given code, you can fix, explain, or improve it. "
        + "Always put C code in markdown code blocks. Only answer C / programming "
        + "questions; if asked something unrelated, gently steer back to C. "
        + (styles[styleSel.value] || styles.detailed);
    }

    function escapeHtml(t) {
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Lightweight markdown — split on code fences so code is never altered.
    // Even chunks are normal text; odd chunks are inside ``` ``` code blocks.
    function format(text) {
      const parts = text.split(/```[a-zA-Z]*\n?/);
      let html = "";
      parts.forEach((part, i) => {
        if (i % 2 === 1) {
          html += "<pre>" + escapeHtml(part.replace(/\n$/, "")) + "</pre>";
        } else {
          let t = escapeHtml(part);
          t = t.replace(/`([^`]+)`/g, "<code>$1</code>");     // inline code
          t = t.replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>"); // headings
          t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");  // **bold**
          t = t.replace(/^\s*[\*\-]\s+/gm, "• ");             // bullets
          html += t;
        }
      });
      return html;
    }

    function addMessage(role, text) {
      document.getElementById("empty")?.remove();
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      div.innerHTML = role === "user" ? escapeHtml(text) : format(text);
      messagesEl.appendChild(div);
      if (role !== "user") addCopyButtons(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    // Add a "Copy" button to each code block in a rendered message.
    function addCopyButtons(container) {
      container.querySelectorAll("pre").forEach((pre) => {
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", () => {
          copyText(pre.textContent).then(() => {
            btn.textContent = "Copied!";
            setTimeout(() => (btn.textContent = "Copy"), 1500);
          });
        });
        wrap.appendChild(btn);
      });
    }

    // Copy text to the clipboard, with a fallback for non-secure contexts.
    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
      } catch (e) { /* fall through to the fallback below */ }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    // ---- Saving the conversation so it survives a page refresh ----
    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function restoreHistory() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const items = JSON.parse(saved);
        for (const item of items) {
          history.push(item);
          const text = item.parts.map((p) => p.text).join("");
          addMessage(item.role === "user" ? "user" : "bot", text);
        }
      } catch (e) { /* ignore corrupt saved data */ }
    }

    function newChat() {
      history.length = 0;
      localStorage.removeItem(STORAGE_KEY);
      messagesEl.innerHTML =
        '<div class="empty" id="empty">Ask me a C question to begin. Example: "Write a program to reverse a string."</div>';
    }

    // Send the conversation to our backend, which forwards it to Gemini.
    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage("user", text);
      history.push({ role: "user", parts: [{ text }] });
      saveHistory();
      inputEl.value = "";
      sendBtn.disabled = true;

      const thinking = addMessage("bot", "Thinking...");
      const payload = {
        systemInstruction: { parts: [{ text: systemText() }] },
        contents: history,
        generationConfig: { temperature: 0.3 },
      };

      let reply = null;
      let lastError = "unknown error";

      // Try up to 3 times — the free model is sometimes briefly "overloaded".
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (res.ok) {
            reply = (data.candidates && data.candidates[0]
              && data.candidates[0].content.parts.map((p) => p.text).join("")) || "(no response)";
            break;
          }
          lastError = data.error ? data.error.message : "HTTP " + res.status;
        } catch (err) {
          lastError = err.message;
        }
        if (attempt < 3) {
          thinking.textContent = "Server busy, retrying... (" + attempt + "/3)";
          await new Promise((r) => setTimeout(r, 1500 * attempt));
        }
      }

      if (reply !== null) {
        thinking.innerHTML = format(reply);
        addCopyButtons(thinking);
        history.push({ role: "model", parts: [{ text: reply }] });
        saveHistory();
      } else {
        thinking.innerHTML = "⚠️ Error: " + escapeHtml(lastError);
        history.pop();
        saveHistory();
      }
      sendBtn.disabled = false;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Enter to send, Shift+Enter for a new line.
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    restoreHistory(); // load any saved conversation when the page opens
  </script>
</body>
</html>
