<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Tutor</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(720px 520px at 6% -5%, #3a2a6b 0%, transparent 55%),
        radial-gradient(820px 620px at 104% 105%, #0e4a6b 0%, transparent 52%),
        #0b1020;
      color: #e2e8f0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .app {
      width: 100%; max-width: 1040px; height: calc(100vh - 40px); display: flex;
      background: #0f172a; border: 1px solid #263351; border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5); overflow: hidden;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 230px; flex-shrink: 0; background: #0b1220; border-right: 1px solid #1e293b;
      display: flex; flex-direction: column; padding: 12px; gap: 10px;
    }
    .newchat {
      border: 1px solid #334155; border-radius: 8px; background: #1e293b;
      color: #e2e8f0; font-size: 0.9rem; font-weight: 600; padding: 10px; cursor: pointer;
    }
    .newchat:hover { background: #273449; }
    .chat-list { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .chat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: #cbd5e1;
    }
    .chat-item:hover { background: #1e293b; }
    .chat-item.active { background: #1e293b; color: #fff; }
    .chat-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-del { border: none; background: transparent; color: #64748b; font-size: 1rem; line-height: 1; cursor: pointer; padding: 0 2px 0 6px; }
    .chat-del:hover { color: #f87171; }

    /* ---- Main ---- */
    .main { flex: 1; display: flex; flex-direction: column; padding: 16px; min-width: 0; }
    header { padding: 6px 4px 12px; }
    header h1 { font-size: 1.25rem; }
    header p { color: #94a3b8; font-size: 0.85rem; }

    .styleBar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.85rem; color: #94a3b8; flex-wrap: wrap; }
    .styleBar select {
      padding: 7px 10px; border: 1px solid #334155; border-radius: 8px;
      background: #0b1220; color: #e2e8f0; font-size: 0.9rem;
    }

    .messages { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 12px; }
    .msg {
      max-width: 88%; padding: 11px 14px; border-radius: 12px; white-space: pre-wrap;
      line-height: 1.5; font-size: 0.95rem; animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .user { background: #1e40af; align-self: flex-end; border-bottom-right-radius: 3px; }
    .bot { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 3px; }
    .code-wrap { position: relative; }
    .bot pre {
      background: #0b1220; border: 1px solid #273449; border-radius: 8px;
      padding: 10px 12px; margin: 8px 0; overflow-x: auto;
      font-family: Consolas, Menlo, monospace; font-size: 0.85rem; white-space: pre;
    }
    .bot code { background: #0b1220; padding: 1px 5px; border-radius: 4px; font-family: Consolas, Menlo, monospace; font-size: 0.85rem; }
    .bot pre .tok-c { color: #6b7280; font-style: italic; }
    .bot pre .tok-s { color: #9ece6a; }
    .bot pre .tok-n { color: #ff9e64; }
    .bot pre .tok-k { color: #7aa2f7; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px; border: none; border-radius: 6px;
      background: #334155; color: #e2e8f0; font-size: 0.72rem; font-weight: 600;
      padding: 4px 9px; cursor: pointer; opacity: 0.85;
    }
    .copy-btn:hover { opacity: 1; }

    /* Animated typing indicator */
    .typing { display: inline-flex; gap: 5px; align-items: center; padding: 2px 0; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; display: inline-block; animation: blink 1.2s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60%, 100% { transform: translateY(0); opacity: 0.35; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* Welcome screen with clickable example prompts */
    .welcome { margin: auto; text-align: center; color: #94a3b8; max-width: 480px; padding: 20px; }
    .welcome .wave { font-size: 2.4rem; }
    .welcome h2 { color: #e2e8f0; font-size: 1.3rem; margin: 8px 0 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
    .chip {
      border: 1px solid #334155; background: #1e293b; color: #cbd5e1; border-radius: 999px;
      padding: 8px 14px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
    }
    .chip:hover { border-color: #38bdf8; color: #fff; }

    .composer { display: flex; gap: 8px; padding-top: 10px; align-items: flex-end; }
    .composer textarea {
      flex: 1; resize: none; min-height: 52px; max-height: 140px; overflow-y: auto; padding: 12px;
      border: 1px solid #334155; border-radius: 8px;
      background: #0b1220; color: #e2e8f0; font-size: 0.95rem; font-family: inherit;
    }
    .composer button {
      border: none; border-radius: 8px; background: #38bdf8; color: #04283b;
      font-weight: 700; padding: 0 20px; height: 52px; cursor: pointer; font-size: 0.95rem;
    }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 640px) { .sidebar { width: 140px; padding: 8px; } }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <button class="newchat" onclick="newChat()">+ New chat</button>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main">
      <header>
        <h1>Code Tutor</h1>
        <p>Ask any programming question — beginner to interview level. It solves code and explains it your way.</p>
      </header>

      <div class="styleBar">
        <span>Language:</span>
        <select id="lang">
          <option value="C">C</option>
          <option value="C++">C++</option>
          <option value="Python">Python</option>
          <option value="Java">Java</option>
          <option value="JavaScript">JavaScript</option>
        </select>
        <span>Explain:</span>
        <select id="style">
          <option value="detailed">In detail (step by step)</option>
          <option value="examples">With examples</option>
          <option value="short">Short &amp; to the point</option>
          <option value="code">Mostly just the code</option>
        </select>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <textarea id="input" placeholder="Type your coding question or paste code... (Enter to send)"></textarea>
        <button id="send" onclick="send()">Send</button>
      </div>
    </main>
  </div>

  <script>
    const WORKER_URL = "https://c-tutor.jkadvertising.workers.dev";
    const CHATS_KEY = "cTutorChats";
    const ACTIVE_KEY = "cTutorActiveId";

    const styleSel = document.getElementById("style");
    const langSel = document.getElementById("lang");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const chatList = document.getElementById("chatList");

    // Example prompts shown on the welcome screen.
    const EXAMPLES = [
      "Write a program to reverse a string",
      "Explain recursion with an example",
      "Array vs linked list — what's the difference?",
      "Give me an easy practice problem",
    ];

    let chats = [];
    let activeId = null;

    // ---- Storage ----
    function loadChats() {
      try { chats = JSON.parse(localStorage.getItem(CHATS_KEY)) || []; }
      catch (e) { chats = []; }
      activeId = localStorage.getItem(ACTIVE_KEY);
    }
    function saveChats() {
      localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
      localStorage.setItem(ACTIVE_KEY, activeId || "");
    }
    function activeChat() { return chats.find((c) => c.id === activeId); }

    // ---- Chat management ----
    function newChat() {
      const chat = { id: String(Date.now()), title: "New chat", messages: [] };
      chats.unshift(chat);
      activeId = chat.id;
      saveChats();
      renderSidebar();
      renderMessages();
      inputEl.focus();
    }
    function switchChat(id) { activeId = id; saveChats(); renderSidebar(); renderMessages(); }
    function deleteChat(id) {
      chats = chats.filter((c) => c.id !== id);
      if (!chats.length) { activeId = null; newChat(); return; }
      if (activeId === id) activeId = chats[0].id;
      saveChats();
      renderSidebar();
      renderMessages();
    }

    // ---- Rendering ----
    function renderSidebar() {
      chatList.innerHTML = "";
      chats.forEach((chat) => {
        const item = document.createElement("div");
        item.className = "chat-item" + (chat.id === activeId ? " active" : "");
        const title = document.createElement("span");
        title.className = "chat-title";
        title.textContent = chat.title || "New chat";
        title.onclick = () => switchChat(chat.id);
        const del = document.createElement("button");
        del.className = "chat-del";
        del.textContent = "×";
        del.title = "Delete chat";
        del.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };
        item.appendChild(title);
        item.appendChild(del);
        chatList.appendChild(item);
      });
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      const chat = activeChat();
      if (!chat || chat.messages.length === 0) {
        renderWelcome();
        return;
      }
      for (const m of chat.messages) {
        addMessage(m.role === "user" ? "user" : "bot", m.parts.map((p) => p.text).join(""));
      }
    }

    // Welcome screen with clickable example prompts.
    function renderWelcome() {
      const box = document.createElement("div");
      box.className = "welcome";
      box.innerHTML =
        '<div class="wave">👋</div>'
        + "<h2>Hi! I'm your Code Tutor</h2>"
        + "<p>Pick your language above, then ask me anything — or try one of these:</p>"
        + '<div class="chips" id="chips"></div>';
      messagesEl.appendChild(box);
      const chips = box.querySelector("#chips");
      EXAMPLES.forEach((ex) => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = ex;
        chip.onclick = () => usePrompt(ex);
        chips.appendChild(chip);
      });
    }

    // Fill the input with a prompt and send it.
    function usePrompt(text) { inputEl.value = text; send(); }

    function escapeHtml(t) {
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Lightweight syntax highlighting for code blocks (no external library).
    function highlightCode(code) {
      const s = escapeHtml(code);
      const pat = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(\d[\d.]*)\b|\b(if|else|elif|for|while|do|switch|case|break|continue|return|int|float|double|char|void|bool|long|short|unsigned|struct|class|def|public|private|protected|static|new|delete|import|from|include|const|let|var|function|print|printf|scanf|cout|cin|std|namespace|using|typedef|true|false|null|None|and|or|not|in|range|try|except|catch|throw|this|self)\b/g;
      return s.replace(pat, (m, com, str, num, kw) => {
        if (com) return '<span class="tok-c">' + com + '</span>';
        if (str) return '<span class="tok-s">' + str + '</span>';
        if (num) return '<span class="tok-n">' + num + '</span>';
        if (kw) return '<span class="tok-k">' + kw + '</span>';
        return m;
      });
    }

    function format(text) {
      const parts = text.split(/```[a-zA-Z]*\n?/);
      let html = "";
      parts.forEach((part, i) => {
        if (i % 2 === 1) {
          html += "<pre>" + highlightCode(part.replace(/\n$/, "")) + "</pre>";
        } else {
          let t = escapeHtml(part);
          t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
          t = t.replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>");
          t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          t = t.replace(/^\s*[\*\-]\s+/gm, "• ");
          html += t;
        }
      });
      return html;
    }

    function addMessage(role, text) {
      messagesEl.querySelector(".welcome")?.remove();
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      div.innerHTML = role === "user" ? escapeHtml(text) : format(text);
      messagesEl.appendChild(div);
      if (role !== "user") addCopyButtons(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    // A bot bubble showing the animated typing dots.
    function addTyping() {
      messagesEl.querySelector(".welcome")?.remove();
      const div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addCopyButtons(container) {
      container.querySelectorAll("pre").forEach((pre) => {
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", () => {
          copyText(pre.textContent).then(() => {
            btn.textContent = "Copied!";
            setTimeout(() => (btn.textContent = "Copy"), 1500);
          });
        });
        wrap.appendChild(btn);
      });
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
      } catch (e) { /* fall through */ }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    function systemText() {
      const lang = langSel.value;
      const styles = {
        detailed: "Explain your solution thoroughly, step by step, so a beginner can follow.",
        examples: "Include example inputs and outputs and show how the code is used.",
        short: "Keep explanations brief and to the point.",
        code: "Give mainly the code with only minimal explanation.",
      };
      return "You are an expert " + lang + " programming tutor. You help with " + lang
        + " questions from beginner to advanced interview level. Given a problem, provide "
        + "correct, well-written " + lang + " code. Given code, you can fix, explain, or "
        + "improve it. Always put code in markdown code blocks. Only answer programming "
        + "questions; if asked something unrelated, gently steer back to coding. "
        + (styles[styleSel.value] || styles.detailed);
    }

    function resetInput() {
      inputEl.value = "";
      inputEl.style.height = "auto";
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      const chat = activeChat();
      if (!chat) return;

      addMessage("user", text);
      chat.messages.push({ role: "user", parts: [{ text }] });
      if (chat.title === "New chat") {
        chat.title = text.length > 30 ? text.slice(0, 30) + "…" : text;
        renderSidebar();
      }
      saveChats();
      resetInput();
      sendBtn.disabled = true;

      const thinking = addTyping();
      const payload = {
        systemInstruction: { parts: [{ text: systemText() }] },
        contents: chat.messages,
        generationConfig: { temperature: 0.3 },
      };

      let reply = null;
      let lastError = "unknown error";

      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (res.ok) {
            reply = (data.candidates && data.candidates[0]
              && data.candidates[0].content.parts.map((p) => p.text).join("")) || "(no response)";
            break;
          }
          lastError = data.error ? data.error.message : "HTTP " + res.status;
        } catch (err) {
          lastError = err.message;
        }
        if (attempt < 3) {
          thinking.innerHTML = "Server busy, retrying... (" + attempt + "/3)";
          await new Promise((r) => setTimeout(r, 1500 * attempt));
        }
      }

      if (reply !== null) {
        thinking.innerHTML = format(reply);
        addCopyButtons(thinking);
        chat.messages.push({ role: "model", parts: [{ text: reply }] });
      } else {
        thinking.innerHTML = "⚠️ Error: " + escapeHtml(lastError);
        chat.messages.pop();
      }
      saveChats();
      sendBtn.disabled = false;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Enter to send; Shift+Enter for a new line; auto-grow the box.
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    });

    // ---- Startup ----
    loadChats();
    if (chats.length && activeChat()) {
      renderSidebar();
      renderMessages();
    } else if (chats.length) {
      activeId = chats[0].id;
      renderSidebar();
      renderMessages();
    } else {
      newChat();
    }
  </script>
</body>
</html>
